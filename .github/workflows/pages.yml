name: Deploy a GitHub Pages (fallback)

# FALLBACK. El deploy principal es Cloudflare Pages (cloudflare-pages.yml);
# el dominio fortalecidosporlaadversidad.com apunta a Cloudflare, no aquí.
# Este workflow queda solo como respaldo manual: se ejecuta a mano desde
# la pestaña Actions (Run workflow). No corre en cada push para no chocar
# con el deploy de Cloudflare ni fallar durante incidentes de GitHub Pages.

on:
  workflow_dispatch:

# Permisos mínimos para publicar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancelamos uno en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir artefacto (sitio estático = carpeta public/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Desplegar a Pages
        id: deployment
        uses: actions/deploy-pages@v4
